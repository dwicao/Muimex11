[versions]
agp = "9.4.0"
coreKtx = "1.19.0"
junit = "4.13.2"
shizuku = "13.1.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
